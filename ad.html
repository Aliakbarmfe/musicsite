<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت | مجموعه بهار</title>
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Vazirmatn', sans-serif; 
    }

    body { 
      background: #000000; 
      color: #E0E0E0; 
      min-height: 100vh; 
      padding: 20px; 
      position: relative;
      overflow-x: hidden;
    }

    /* هاله نورانی نئونی در پس‌زمینه */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(30, 144, 255, 0.25) 0%, transparent 45%);
      pointer-events: none;
      z-index: -1;
    }

    /* عناوین و متون */
    h1, h2, h3, h4, h5, h6 {
      color: #FFFFFF;
    }

    .modal-box h3 {
      color: #00F3FF;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
      margin-bottom: 15px;
    }

    /* تاپ بار */
    .top-bar {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      background: rgba(16, 16, 16, 0.65); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 20px; 
      border-radius: 12px; 
      margin-bottom: 25px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
    }

    /* دکمه‌ها و عناصر تعاملی */
    .btn-icon { 
      background: linear-gradient(135deg, #8A2BE2, #00F3FF); 
      color: #FFFFFF; 
      border: none; 
      font-size: 20px; 
      font-weight: bold; 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      cursor: pointer; 
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
      transition: all 0.3s ease;
    }

    .btn-logout { 
      background: rgba(16, 16, 16, 0.6); 
      color: #E0E0E0; 
      border: 1px solid #8A2BE2; 
      padding: 8px 16px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .btn-info { 
      background: linear-gradient(135deg, #8A2BE2, #00F3FF); 
      color: #FFFFFF; 
      border: none; 
      padding: 8px 16px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      box-shadow: 0 0 12px rgba(138, 43, 226, 0.4);
      transition: all 0.3s ease;
    }

    .btn-icon:hover, .btn-info:hover {
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
      transform: translateY(-2px);
    }

    .btn-logout:hover {
      background: rgba(138, 43, 226, 0.2);
      box-shadow: 0 0 12px rgba(138, 43, 226, 0.5);
      color: #FFFFFF;
    }

    /* لیست و کارت‌ها */
    .song-list { 
      max-width: 600px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }

    .song-card {
      background: rgba(16, 16, 16, 0.7); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px; 
      border-radius: 14px; 
      border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 243, 255, 0.05);
      display: flex; 
      flex-direction: column; 
      gap: 10px;
      transition: all 0.3s ease;
    }

    .song-card:hover {
      border-color: rgba(0, 243, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }

    .song-card span {
      color: #FFD700; /* آکسان طلایی برای عنوان فایل */
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .action-btns { 
      display: flex; 
      gap: 10px; 
      margin-top: 5px; 
    }

    .btn-edit { 
      background: rgba(16, 16, 16, 0.6); 
      color: #E0E0E0; 
      border: 1px solid #8A2BE2; 
      padding: 6px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px; 
      transition: all 0.3s ease;
    }

    .btn-edit:hover {
      background: rgba(138, 43, 226, 0.3);
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
    }

    .btn-delete { 
      background: rgba(220, 38, 38, 0.2); 
      color: #ff6b6b; 
      border: 1px solid #dc2626; 
      padding: 6px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px; 
      transition: all 0.3s ease;
    }

    .btn-delete:hover {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
    }

    /* Modal */
    .modal-overlay {
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0;
      background: rgba(0, 0, 0, 0.85); 
      backdrop-filter: blur(8px);
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 1000;
    }

    .modal-overlay.active { 
      display: flex; 
    }

    .modal-box {
      background: rgba(16, 16, 16, 0.85); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px; 
      padding: 24px;
      width: 90%; 
      max-width: 400px; 
      text-align: center; 
      border: 1px solid rgba(0, 243, 255, 0.4);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
    }

    .modal-box input {
      width: 100%; 
      padding: 12px; 
      margin-bottom: 12px; 
      background: #000000;
      border: 1px solid rgba(138, 43, 226, 0.5); 
      border-radius: 8px; 
      color: #E0E0E0; 
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .modal-box input:focus {
      border-color: #00F3FF;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    /* Progress Bar */
    .progress-bar-bg { 
      width: 100%; 
      height: 12px; 
      background: #101010; 
      border-radius: 6px; 
      overflow: hidden; 
      margin: 10px 0; 
      border: 1px solid rgba(138, 43, 226, 0.3);
    }

    .progress-bar-fill { 
      width: 0%; 
      height: 100%; 
      background: linear-gradient(90deg, #8A2BE2, #00F3FF); 
      box-shadow: 0 0 10px #00F3FF;
      transition: width 0.2s; 
    }

    /* استایل شخصی‌سازی شده برای کنترلر موزیک */
    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      margin-top: 5px;
      filter: invert(0.9) hue-rotate(180deg);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-logout" onclick="logout()">خروج</button>
    <button class="btn-info" onclick="openModal('infoModal')">اطلاعات مدیر</button>
    <button class="btn-icon" onclick="openModal('addModal')">+</button>
  </div>

  <div class="song-list" id="songsContainer"></div>

  <!-- Add Song Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box">
      <h3>افزودن آهنگ جدید</h3>
      <input type="text" id="songTitle" placeholder="نام آهنگ">
      <input type="file" id="songFile" accept="audio/*">
      
      <div id="uploadProgress" style="display:none;">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <p id="progressStatus" style="font-size: 12px; color: #E0E0E0;"></p>
      </div>

      <button class="btn-info" style="width:100%; margin-top:15px;" onclick="uploadAndSaveSong()">آپلود و ثبت</button>
      <button class="btn-logout" style="width:100%; margin-top:8px;" onclick="closeModal('addModal')">انصراف</button>
    </div>
  </div>

  <!-- Admin Info Modal -->
  <div class="modal-overlay" id="infoModal">
    <div class="modal-box">
      <h3>تغییر اطلاعات مدیر</h3>
      <input type="text" id="newAdminUser" placeholder="نام کاربری جدید">
      <input type="password" id="newAdminPass" placeholder="رمز عبور جدید">
      <button class="btn-info" style="width:100%; margin-top:10px;" onclick="updateAdminInfo()">ثبت تغییرات</button>
      <button class="btn-logout" style="width:100%; margin-top:8px;" onclick="closeModal('infoModal')">انصراف</button>
    </div>
  </div>

  <script>
    // اطلاعات کامل و دقیق اتصال به Supabase
    const SUPABASE_URL = 'https://wfbisnmbqtlfpbjzvmfq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmYmlzbm1icXRsZnBianp2bWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODk2OTIsImV4cCI6MjEwMjU2NTY5Mn0.BGTfdOHabMdzJo4O32BE-ESApc0e9Rl1PF0VSzuLeW8';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // بررسی ورود و جلوگیری از برگشت صفحه
    if (!sessionStorage.getItem('isLoggedIn')) {
      window.location.href = 'index.html';
    }
    history.pushState(null, null, location.href);
    window.onpopstate = function () { history.go(1); };

    function logout() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function loadSongs() {
      const res = await fetch('/api/get-songs');
      const data = await res.json();
      const container = document.getElementById('songsContainer');
      container.innerHTML = '';
      if (data.songs) {
        data.songs.forEach(song => {
          container.innerHTML += `
            <div class="song-card">
              <span style="font-weight:bold;">${song.title}</span>
              <audio controls src="${song.url}"></audio>
              <div class="action-btns">
                <button class="btn-edit" onclick="editSong(${song.id}, '${song.title}')">ویرایش نام</button>
                <button class="btn-delete" onclick="deleteSong(${song.id}, '${song.url}')">حذف</button>
              </div>
            </div>
          `;
        });
      }
    }

    async function uploadAndSaveSong() {
      const title = document.getElementById('songTitle').value;
      const fileInput = document.getElementById('songFile');
      const file = fileInput.files[0];

      if (!title || !file) return alert('نام و فایل آهنگ الزامی است');

      const progressDiv = document.getElementById('uploadProgress');
      const progressFill = document.getElementById('progressFill');
      const progressStatus = document.getElementById('progressStatus');
      progressDiv.style.display = 'block';

      // نام‌گذاری ایمن برای فایل
      const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
      const fileName = `${Date.now()}_${cleanFileName}`;

      // آپلود مستقیم به Supabase Storage
      const { data, error } = await supabaseClient.storage
        .from('songs')
        .upload(fileName, file, {
          cacheControl: '3600',
          upsert: false
        });

      if (error) {
        alert('خطا در آپلود: ' + error.message);
        return;
      }

      // دریافت لینک عمومی فایل
      const { data: publicUrlData } = supabaseClient.storage.from('songs').getPublicUrl(fileName);

      // ذخیره در دیتابیس
      await fetch('/api/manage-song', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, url: publicUrlData.publicUrl })
      });

      alert('آهنگ با موفقیت آپلود شد!');
      closeModal('addModal');
      loadSongs();
    }

    async function editSong(id, currentTitle) {
      const newTitle = prompt('نام جدید آهنگ را وارد کنید:', currentTitle);
      if (newTitle) {
        await fetch('/api/manage-song', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, title: newTitle })
        });
        loadSongs();
      }
    }

    async function deleteSong(id, url) {
      if (confirm('آیا از حذف این آهنگ اطمینان دارید؟')) {
        const fileName = url.split('/').pop();
        await fetch('/api/manage-song', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, fileName })
        });
        loadSongs();
      }
    }

    async function updateAdminInfo() {
      const newU = document.getElementById('newAdminUser').value;
      const newP = document.getElementById('newAdminPass').value;
      const curU = sessionStorage.getItem('adminUser');
      const curP = sessionStorage.getItem('adminPass');

      const res = await fetch('/api/update-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentUsername: curU,
          currentPassword: curP,
          newUsername: newU,
          newPassword: newP
        })
      });
      const data = await res.json();
      alert(data.message);
      if (data.success) {
        sessionStorage.setItem('adminUser', newU);
        sessionStorage.setItem('adminPass', newP);
        closeModal('infoModal');
      }
    }

    loadSongs();
  </script>
</body>
</html>
