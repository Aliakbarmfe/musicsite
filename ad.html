<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت | مجموعه بهار</title>
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; padding: 15px 20px; border-radius: 12px; margin-bottom: 25px;
    }
    .btn-icon { background: #38bdf8; color: #0f172a; border: none; font-size: 20px; font-weight: bold; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-info { background: #f59e0b; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .song-list { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    .song-card {
      background: #1e293b; padding: 16px; border-radius: 14px; border: 1px solid #334155;
      display: flex; flex-direction: column; gap: 10px;
    }
    .action-btns { display: flex; gap: 10px; margin-top: 5px; }
    .btn-edit { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-delete { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #1e293b; border-radius: 16px; padding: 24px;
      width: 90%; max-width: 400px; text-align: center; border: 1px solid #334155;
    }
    .modal-box input {
      width: 100%; padding: 12px; margin-bottom: 12px; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px;
    }
    .progress-bar-bg { width: 100%; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin: 10px 0; }
    .progress-bar-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.2s; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-logout" onclick="logout()">خروج</button>
    <button class="btn-info" onclick="openModal('infoModal')">اطلاعات مدیر</button>
    <button class="btn-icon" onclick="openModal('addModal')">+</button>
  </div>

  <div class="song-list" id="songsContainer"></div>

  <!-- Add Song Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box">
      <h3>افزودن آهنگ جدید</h3>
      <input type="text" id="songTitle" placeholder="نام آهنگ">
      <input type="file" id="songFile" accept="audio/*">
      
      <div id="uploadProgress" style="display:none;">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <p id="progressStatus" style="font-size: 12px; color: #cbd5e1;"></p>
      </div>

      <button class="btn-info" style="width:100%; margin-top:15px; background:#10b981;" onclick="uploadAndSaveSong()">آپلود و ثبت</button>
      <button class="btn-logout" style="width:100%; margin-top:8px;" onclick="closeModal('addModal')">انصراف</button>
    </div>
  </div>

  <!-- Admin Info Modal -->
  <div class="modal-overlay" id="infoModal">
    <div class="modal-box">
      <h3>تغییر اطلاعات مدیر</h3>
      <input type="text" id="newAdminUser" placeholder="نام کاربری جدید">
      <input type="password" id="newAdminPass" placeholder="رمز عبور جدید">
      <button class="btn-info" style="width:100%; margin-top:10px;" onclick="updateAdminInfo()">ثبت تغییرات</button>
      <button class="btn-logout" style="width:100%; margin-top:8px;" onclick="closeModal('infoModal')">انصراف</button>
    </div>
  </div>

  <script>
    // اطلاعات کامل و دقیق اتصال به Supabase
    const SUPABASE_URL = 'https://wfbisnmbqtlfpbjzvmfq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmYmlzbm1icXRsZnBianp2bWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODk2OTIsImV4cCI6MjEwMjU2NTY5Mn0.BGTfdOHabMdzJo4O32BE-ESApc0e9Rl1PF0VSzuLeW8';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // بررسی ورود و جلوگیری از برگشت صفحه
    if (!sessionStorage.getItem('isLoggedIn')) {
      window.location.href = 'index.html';
    }
    history.pushState(null, null, location.href);
    window.onpopstate = function () { history.go(1); };

    function logout() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function loadSongs() {
      const res = await fetch('/api/get-songs');
      const data = await res.json();
      const container = document.getElementById('songsContainer');
      container.innerHTML = '';
      if (data.songs) {
        data.songs.forEach(song => {
          container.innerHTML += `
            <div class="song-card">
              <span style="font-weight:bold;">${song.title}</span>
              <audio controls src="${song.url}"></audio>
              <div class="action-btns">
                <button class="btn-edit" onclick="editSong(${song.id}, '${song.title}')">ویرایش نام</button>
                <button class="btn-delete" onclick="deleteSong(${song.id}, '${song.url}')">حذف</button>
              </div>
            </div>
          `;
        });
      }
    }

    async function uploadAndSaveSong() {
      const title = document.getElementById('songTitle').value;
      const fileInput = document.getElementById('songFile');
      const file = fileInput.files[0];

      if (!title || !file) return alert('نام و فایل آهنگ الزامی است');

      const progressDiv = document.getElementById('uploadProgress');
      const progressFill = document.getElementById('progressFill');
      const progressStatus = document.getElementById('progressStatus');
      progressDiv.style.display = 'block';

      // نام‌گذاری ایمن برای فایل
      const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
      const fileName = `${Date.now()}_${cleanFileName}`;

      // آپلود مستقیم به Supabase Storage
      const { data, error } = await supabaseClient.storage
        .from('songs')
        .upload(fileName, file, {
          cacheControl: '3600',
          upsert: false
        });

      if (error) {
        alert('خطا در آپلود: ' + error.message);
        return;
      }

      // دریافت لینک عمومی فایل
      const { data: publicUrlData } = supabaseClient.storage.from('songs').getPublicUrl(fileName);

      // ذخیره در دیتابیس
      await fetch('/api/manage-song', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, url: publicUrlData.publicUrl })
      });

      alert('آهنگ با موفقیت آپلود شد!');
      closeModal('addModal');
      loadSongs();
    }

    async function editSong(id, currentTitle) {
      const newTitle = prompt('نام جدید آهنگ را وارد کنید:', currentTitle);
      if (newTitle) {
        await fetch('/api/manage-song', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, title: newTitle })
        });
        loadSongs();
      }
    }

    async function deleteSong(id, url) {
      if (confirm('آیا از حذف این آهنگ اطمینان دارید؟')) {
        const fileName = url.split('/').pop();
        await fetch('/api/manage-song', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, fileName })
        });
        loadSongs();
      }
    }

    async function updateAdminInfo() {
      const newU = document.getElementById('newAdminUser').value;
      const newP = document.getElementById('newAdminPass').value;
      const curU = sessionStorage.getItem('adminUser');
      const curP = sessionStorage.getItem('adminPass');

      const res = await fetch('/api/update-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentUsername: curU,
          currentPassword: curP,
          newUsername: newU,
          newPassword: newP
        })
      });
      const data = await res.json();
      alert(data.message);
      if (data.success) {
        sessionStorage.setItem('adminUser', newU);
        sessionStorage.setItem('adminPass', newP);
        closeModal('infoModal');
      }
    }

    loadSongs();
  </script>
</body>
</html>
