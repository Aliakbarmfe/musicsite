<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجموعه آهنگ بهار</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    header { width: 100%; max-width: 600px; text-align: center; position: relative; margin-bottom: 25px; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #334155; }
    .menu-btn { position: absolute; top: 15px; left: 15px; font-size: 24px; cursor: pointer; background: none; border: none; color: #f8fafc; padding: 5px 10px; border-radius: 8px; transition: 0.2s; }
    .menu-btn:hover { background: #334155; }
    
    h1 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 10px; }
    hr { border: 0; height: 1px; background: #334155; margin: 12px 0; }
    .info-text { font-size: 0.9rem; line-height: 1.9; color: #cbd5e1; }
    .info-text a { color: #f43f5e; text-decoration: none; font-weight: bold; }

    .song-list { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }
    .song-card { background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .song-title { font-size: 1.05rem; color: #f8fafc; font-weight: bold; }
    audio { width: 100%; height: 40px; border-radius: 8px; outline: none; }
    .download-btn { background: #38bdf8; color: #0f172a; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
    .download-btn:hover { background: #0284c7; color: #fff; }

    /* Modal / Popups */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); z-index: 1000; }
    .modal { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal h3 { margin-bottom: 15px; color: #38bdf8; font-size: 1.1rem; }
    .modal input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; direction: ltr; text-align: center; }
    .modal button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .modal button:hover { background: #0284c7; color: #fff; }
    .modal button.close-btn { background: #475569; color: #fff; margin-top: 8px; }
    .modal button.close-btn:hover { background: #334155; }
    .error-msg { color: #f43f5e; font-size: 0.85rem; display: none; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <button class="menu-btn" onclick="openMenuModal()">⋮</button>
    <h1>خوش اومدی به مجموعه آهنگ بهار 😎</h1>
    <hr>
    <div class="info-text">
      شعبه 1😍 <a href="https://t.me/BAHARM100" target="_blank">@BAHARM100</a><br>
      شعبه 2😍 <a href="https://t.me/BAHARM200" target="_blank">@BAHARM200</a><br>
      ربات مجموعه هم تقدیم شما 😍😎 <a href="https://t.me/bot_tablighat_81bot" target="_blank">@bot_tablighat_81bot</a><br>
      مدیریت سایت و مالک 😎 <a href="https://t.me/OxenMOxen_210" target="_blank">@OxenMOxen_210</a>
    </div>
  </header>

  <div class="song-list" id="songContainer">
    <p style="text-align:center; color:#94a3b8;">در حال دریافت آهنگ‌ها...</p>
  </div>

  <!-- Menu Modal -->
  <div class="modal-overlay" id="menuModal">
    <div class="modal">
      <h3>منو</h3>
      <button onclick="openLoginModal()">ورود مدیر</button>
      <button class="close-btn" onclick="closeModal('menuModal')">بستن</button>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <h3>ورود به پنل مدیریت</h3>
      <input type="text" id="username" placeholder="نام کاربری">
      <input type="password" id="password" placeholder="رمز عبور">
      <div id="loginError" class="error-msg"></div>
      <button onclick="handleLogin()">ورود</button>
      <button class="close-btn" onclick="closeModal('loginModal')">انصراف</button>
    </div>
  </div>

  <script>
    async function fetchSongs() {
      try {
        const res = await fetch('/api/supabase?action=get-songs');
        const songs = await res.json();
        const container = document.getElementById('songContainer');
        container.innerHTML = '';

        if (!songs || songs.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#94a3b8;">هیچ آهنگی یافت نشد.</p>';
          return;
        }

        songs.forEach(song => {
          const card = document.createElement('div');
          card.className = 'song-card';
          card.innerHTML = `
            <div class="song-title">${song.title}</div>
            <audio controls src="${song.audio_url}"></audio>
            <a href="${song.audio_url}" download="${song.title}.mp3" class="download-btn">دانلود آهنگ</a>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        document.getElementById('songContainer').innerHTML = '<p style="text-align:center; color:#f43f5e;">خطا در ارتباط با سرور</p>';
      }
    }

    function openMenuModal() { document.getElementById('menuModal').style.display = 'flex'; }
    function openLoginModal() { 
      closeModal('menuModal');
      document.getElementById('loginModal').style.display = 'flex'; 
    }
    function closeModal(id) { 
      document.getElementById(id).style.display = 'none'; 
      if(id === 'loginModal') {
        document.getElementById('loginError').style.display = 'none';
      }
    }

    async function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errP = document.getElementById('loginError');

      if (!user || !pass) {
        errP.innerText = 'لطفا نام کاربری و رمز عبور را وارد کنید';
        errP.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/supabase?action=login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username: user, password: pass })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          sessionStorage.setItem('adminToken', data.token);
          window.location.href = 'ad.html';
        } else {
          errP.innerText = data.message || 'نام کاربری یا رمز عبور اشتباه است';
          errP.style.display = 'block';
        }
      } catch (e) {
        errP.innerText = 'خطا در برقراری ارتباط';
        errP.style.display = 'block';
      }
    }

    fetchSongs();
  </script>
</body>
  </html>
