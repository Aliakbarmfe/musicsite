<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مجموعه آهنگ بهار 😎</title>
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
    
    .header {
      text-align: center;
      padding: 20px;
      background: #1e293b;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      position: relative;
    }
    .top-menu-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #334155;
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header h1 { font-size: 22px; color: #38bdf8; margin-bottom: 12px; }
    .header-line { height: 2px; background: linear-gradient(90deg, transparent, #38bdf8, transparent); margin: 15px 0; }
    .channels p { margin: 6px 0; font-size: 14px; color: #cbd5e1; }
    .channels a { color: #f43f5e; text-decoration: none; font-weight: bold; }

    .song-list { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    .song-card {
      background: #1e293b;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .song-title { font-weight: bold; font-size: 16px; color: #f1f5f9; }
    audio { width: 100%; height: 40px; border-radius: 8px; }
    .download-btn {
      align-self: flex-end;
      background: #10b981;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    /* Popup Modal Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #1e293b; border-radius: 16px; padding: 24px;
      width: 90%; max-width: 380px; text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .modal-box h3 { margin-bottom: 15px; color: #f8fafc; }
    .modal-box input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #fff; font-size: 14px;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #0284c7; color: white; font-weight: bold;
      cursor: pointer; font-size: 14px; margin-top: 5px;
    }
    .btn-close { background: #64748b; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <button class="top-menu-btn" onclick="openMenuModal()">⋮</button>
    <h1>خوش اومدی به مجموعه آهنگ بهار 😎</h1>
    <div class="header-line"></div>
    <div class="channels">
      <p>شعبه 1😍 <a href="https://t.me/BAHARM100" target="_blank">@BAHARM100</a></p>
      <p>شعبه 2😍 <a href="https://t.me/BAHARM200" target="_blank">@BAHARM200</a></p>
      <p>ربات مجموعه هم تقدیم شما 😍😎 <a href="https://t.me/bot_tablighat_81bot" target="_blank">@bot_tablighat_81bot</a></p>
      <p>مدیریت سایت و مالک 😎 <a href="https://t.me/OxenMOxen_210" target="_blank">@OxenMOxen_210</a></p>
    </div>
  </div>

  <div class="song-list" id="songsContainer">
    <p style="text-align: center; color: #94a3b8;">در حال بارگذاری لیست آهنگ‌ها...</p>
  </div>

  <!-- Menu Modal -->
  <div class="modal-overlay" id="menuModal">
    <div class="modal-box">
      <h3>منوی مدیریت</h3>
      <button class="btn" onclick="openLoginModal()">ورود مدیر</button>
      <button class="btn btn-close" onclick="closeModal('menuModal')">بستن</button>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <h3>ورود مدیر سیستم</h3>
      <input type="text" id="adminUser" placeholder="نام کاربری">
      <input type="password" id="adminPass" placeholder="رمز عبور">
      <p id="loginError" style="color: #ef4444; font-size: 13px; display: none; margin-bottom: 10px;"></p>
      <button class="btn" onclick="handleLogin()">ورود</button>
      <button class="btn btn-close" onclick="closeModal('loginModal')">انصراف</button>
    </div>
  </div>

  <script>
    async function fetchSongs() {
      try {
        const res = await fetch('/api/get-songs');
        const data = await res.json();
        const container = document.getElementById('songsContainer');
        container.innerHTML = '';
        if (data.songs && data.songs.length > 0) {
          data.songs.forEach(song => {
            container.innerHTML += `
              <div class="song-card">
                <div class="song-title">${song.title}</div>
                <audio controls src="${song.url}"></audio>
                <a class="download-btn" href="${song.url}" download target="_blank">دانلود آهنگ</a>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p style="text-align: center; color: #94a3b8;">آهنگی یافت نشد.</p>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    function openMenuModal() { document.getElementById('menuModal').classList.add('active'); }
    function openLoginModal() {
      closeModal('menuModal');
      document.getElementById('loginModal').classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function handleLogin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      const errBox = document.getElementById('loginError');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();

      if (data.success) {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('adminUser', u);
        sessionStorage.setItem('adminPass', p);
        window.location.href = 'ad.html';
      } else {
        errBox.innerText = data.message;
        errBox.style.display = 'block';
      }
    }

    fetchSongs();
  </script>
</body>
</html>
