<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مجموعه آهنگ بهار 😎</title>
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Vazirmatn', sans-serif; 
    }

    /* ۱. پس‌زمینه اصلی (Body): مشکی خالص + هاله نورانی بنفش و آبی */
    body { 
      background-color: #000000; 
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(30, 144, 255, 0.25) 0%, transparent 45%);
      background-attachment: fixed;
      color: #E0E0E0; 
      min-height: 100vh; 
      padding: 20px; 
    }
    
    /* ۲. کارت‌ها و کادرها: خاکستری بسیار تیره #101010 با شفافیت، Glassmorphism و حاشیه فیروزه‌ای نئونی */
    .header {
      text-align: center;
      padding: 24px 20px;
      background: rgba(16, 16, 16, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      margin-bottom: 25px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 243, 255, 0.15);
      position: relative;
    }

    /* ۳. دکمه‌ها و عناصر تعاملی: دکمه منوی اصلی با استایل شیشه‌ای و حاشیه بنفش */
    .top-menu-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(16, 16, 16, 0.6);
      backdrop-filter: blur(8px);
      color: #00F3FF;
      border: 1px solid #8A2BE2;
      box-shadow: 0 0 8px rgba(138, 43, 226, 0.4);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .top-menu-btn:hover {
      background: rgba(138, 43, 226, 0.3);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
      transform: scale(1.05);
    }

    /* ۳. متن‌ها و عناوین: عنوان اصلی فیروزه‌ای با سایه نئونی */
    .header h1 { 
      font-size: 22px; 
      color: #00F3FF; 
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6), 0 0 20px rgba(0, 243, 255, 0.3);
      margin-bottom: 12px; 
      font-weight: 800;
    }

    .header-line { 
      height: 2px; 
      background: linear-gradient(90deg, transparent, #00F3FF, #8A2BE2, transparent); 
      margin: 15px 0; 
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    .channels p { 
      margin: 8px 0; 
      font-size: 14px; 
      color: #E0E0E0; 
    }

    /* ۵. جزئیات و آکسان‌ها: رنگ طلایی #FFD700 برای آیکون‌ها و آیدی‌های قابل کپی */
    .channels .copy-tag { 
      color: #FFD700; 
      cursor: pointer;
      font-weight: bold; 
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
      transition: all 0.3s ease;
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      direction: ltr;
    }
    .channels .copy-tag:hover {
      color: #00F3FF;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
      background: rgba(0, 243, 255, 0.1);
    }

    .song-list { 
      max-width: 600px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }

    /* کارت آهنگ‌ها */
    .song-card {
      background: rgba(16, 16, 16, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 10px rgba(138, 43, 226, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .song-card:hover {
      border-color: rgba(0, 243, 255, 0.6);
      box-shadow: 0 6px 24px rgba(0,0,0,0.7), 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .song-title { 
      font-weight: bold; 
      font-size: 16px; 
      color: #FFFFFF; 
    }

    audio { 
      width: 100%; 
      height: 40px; 
      border-radius: 8px; 
      filter: invert(0.9) hue-rotate(180deg);
    }

    /* ۴. دکمه اصلی دانلود: گرادینت بنفش به فیروزه‌ای */
    .download-btn {
      align-self: flex-end;
      background: linear-gradient(135deg, #8A2BE2, #00F3FF);
      color: #FFFFFF;
      padding: 9px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(138, 43, 226, 0.5);
      transition: all 0.3s ease;
    }
    .download-btn:hover {
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.8);
      transform: translateY(-2px);
    }

    /* مدال‌ها و پنجره‌های پاپ‌آپ */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; 
      backdrop-filter: blur(8px);
    }
    .modal-overlay.active { display: flex; }
    
    .modal-box {
      background: rgba(16, 16, 16, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px; 
      padding: 24px;
      width: 90%; 
      max-width: 380px; 
      text-align: center;
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.3), 0 0 10px rgba(0, 243, 255, 0.2);
      border: 1px solid rgba(0, 243, 255, 0.4);
    }

    .modal-box h3 { 
      margin-bottom: 15px; 
      color: #FFFFFF; 
      font-size: 18px;
    }

    .modal-box input {
      width: 100%; 
      padding: 12px; 
      margin-bottom: 12px;
      background: #000000; 
      border: 1px solid rgba(138, 43, 226, 0.5);
      border-radius: 8px; 
      color: #E0E0E0; 
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .modal-box input:focus {
      border-color: #00F3FF;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    .btn {
      width: 100%; 
      padding: 12px; 
      border: none; 
      border-radius: 8px;
      background: linear-gradient(135deg, #8A2BE2, #00F3FF); 
      color: #FFFFFF; 
      font-weight: bold;
      cursor: pointer; 
      font-size: 14px; 
      margin-top: 5px;
      box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
      transition: all 0.3s ease;
    }
    .btn:hover {
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.7);
    }

    .btn-close { 
      background: rgba(16, 16, 16, 0.6); 
      border: 1px solid #8A2BE2;
      color: #E0E0E0;
      box-shadow: none;
      margin-top: 8px; 
    }
    .btn-close:hover {
      background: rgba(138, 43, 226, 0.2);
      border-color: #00F3FF;
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
    }

    /* استایل پیام اعلان کپی نئونی (Toast Notification) */
    .toast-notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 16, 16, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid #00F3FF;
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 10px rgba(138, 43, 226, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 2000;
      pointer-events: none;
    }
    .toast-notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="header">
    <button class="top-menu-btn" onclick="openMenuModal()">⋮</button>
    <h1>خوش اومدی به مجموعه آهنگ بهار 😎</h1>
    <div class="header-line"></div>
    <div class="channels">
      <p>شعبه 1😍 <span class="copy-tag" onclick="copyText('@BAHARM100')">@BAHARM100</span></p>
      <p>شعبه 2😍 <span class="copy-tag" onclick="copyText('@BAHARM200')">@BAHARM200</span></p>
      <p>ربات مجموعه هم تقدیم شما 😍😎 <span class="copy-tag" onclick="copyText('@bot_tablighat_81bot')">@bot_tablighat_81bot</span></p>
      <p>مدیریت سایت و مالک 😎 <span class="copy-tag" onclick="copyText('@OxenMOxen_210')">@OxenMOxen_210</span></p>
    </div>
  </div>

  <div class="song-list" id="songsContainer">
    <p style="text-align: center; color: #E0E0E0;">در حال بارگذاری لیست آهنگ‌ها...</p>
  </div>

  <!-- Menu Modal -->
  <div class="modal-overlay" id="menuModal">
    <div class="modal-box">
      <h3>منوی مدیریت</h3>
      <button class="btn" onclick="openLoginModal()">ورود مدیر</button>
      <button class="btn btn-close" onclick="closeModal('menuModal')">بستن</button>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <h3>ورود مدیر سیستم</h3>
      <input type="text" id="adminUser" placeholder="نام کاربری">
      <input type="password" id="adminPass" placeholder="رمز عبور">
      <p id="loginError" style="color: #ff4d4d; font-size: 13px; display: none; margin-bottom: 10px;"></p>
      <button class="btn" onclick="handleLogin()">ورود</button>
      <button class="btn btn-close" onclick="closeModal('loginModal')">انصراف</button>
    </div>
  </div>

  <!-- Toast Notification Box -->
  <div class="toast-notification" id="toast">
    <span>✨</span>
    <span id="toastMessage">کپی شد!</span>
  </div>

  <script>
    /* تابع اختصاصی کپی در حافظه و نمایش اعلان نئونی */
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`آیدی ${text} کپی شد! ✨`);
      }).catch(err => {
        // روش جایگزین برای مرورگرهای قدیمی‌تر
        const tempInput = document.createElement('input');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(`آیدی ${text} کپی شد! ✨`);
      });
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.innerText = message;
      
      toast.classList.add('show');
      
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    async function fetchSongs() {
      try {
        const res = await fetch('/api/get-songs');
        const data = await res.json();
        const container = document.getElementById('songsContainer');
        container.innerHTML = '';
        if (data.songs && data.songs.length > 0) {
          data.songs.forEach(song => {
            container.innerHTML += `
              <div class="song-card">
                <div class="song-title">${song.title}</div>
                <audio controls src="${song.url}"></audio>
                <a class="download-btn" href="${song.url}" download target="_blank">دانلود آهنگ</a>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p style="text-align: center; color: #E0E0E0;">آهنگی یافت نشد.</p>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    function openMenuModal() { document.getElementById('menuModal').classList.add('active'); }
    function openLoginModal() {
      closeModal('menuModal');
      document.getElementById('loginModal').classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function handleLogin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      const errBox = document.getElementById('loginError');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();

      if (data.success) {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('adminUser', u);
        sessionStorage.setItem('adminPass', p);
        window.location.href = 'ad.html';
      } else {
        errBox.innerText = data.message;
        errBox.style.display = 'block';
      }
    }

    fetchSongs();
  </script>
</body>
</html>
